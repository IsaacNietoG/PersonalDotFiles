name: Tangle & Weave

on:
  push:
    branches: [main]
    paths:
      - "**/*.org"
      - ".github/workflows/tangle-weave.yml"
  pull_request:
    paths:
      - "**/*.org"
      - ".github/workflows/tangle-weave.yml"
  workflow_dispatch:

jobs:
  tangle-and-weave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: "31.1"

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-plain-generic

      - name: Tangle literate dotfiles
        run: |
          emacs --batch \
            --eval "(setq org-confirm-babel-evaluate nil org-src-preserve-indentation t org-edit-src-content-indentation 0)" \
            --eval "(require 'org)" \
            --eval "(progn (org-babel-tangle-file \"Arch/docs/main.org\") (org-babel-tangle-file \"NixOS/docs/main.org\"))"

      - name: Verify tangled files match committed dotfiles
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            echo "::error::Committed dotfiles are out of sync with the literate .org sources. Re-tangle and commit the results."
            git diff --cached --stat
            git diff --cached
            exit 1
          fi

      - name: Weave (export PDF documentation)
        run: |
          # Each export needs its own Emacs process: a second
          # org-latex-export-to-pdf in the same session fails the
          # file-writable-p check on the output ("Output file not
          # writable"), even for files in the same directory.
          for org in Arch/docs/main.org NixOS/docs/main.org; do
            dir=$(dirname "$org")
            emacs --batch \
              --eval "(setq org-confirm-babel-evaluate nil)" \
              --eval "(require 'ox-latex)" \
              --eval "(progn (find-file \"$org\") (org-latex-export-to-pdf))"
            # Drop LaTeX build artifacts so they never pollute the repo.
            rm -f "$dir"/main.{aux,bbl,blg,fla,fls,fdb_latexmk,log,out,toc,idx,ilg,ind,lof,lot,nav,snm,vrb}
          done

      - name: Upload PDF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: |
            Arch/docs/main.pdf
            NixOS/docs/main.pdf
